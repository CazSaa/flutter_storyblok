name: example
description: Example app implementing Storybloks Demo Space
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_storyblok:
    path: ../
  go_router: ^17.2.2
  video_player: ^2.11.1
  wave: ^0.2.2
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_storyblok_code_generator:
    path: ../code_generator
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_storyblok:
    path: ../

flutter:
  uses-material-design: true

  assets:
    - assets/
